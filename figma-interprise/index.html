<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Figma Interprise</title>
<style>
  :root {
    --paper: #fdfbf6; --ink: #1e1e1e; --soft: #5c5f62; --accent: #f08c00;
    --bar: rgba(255,255,255,.92); --line: rgba(30,30,30,.16);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink);
    font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  #stage svg, #paper { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .bar { position: fixed; z-index: 2; display: flex; align-items: center; gap: 4px; padding: 6px;
    background: var(--bar); border: 1.5px solid var(--line); border-radius: 14px;
    box-shadow: 2px 3px 0 rgba(0,0,0,.08); backdrop-filter: blur(6px); }
  #top { top: 12px; left: 12px; padding: 8px 14px; font-weight: 600; font-size: 16px; }
  #tools { bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); }
  button { font: inherit; color: inherit; background: transparent; border: 0; border-radius: 9px;
    min-width: 38px; height: 38px; padding: 0 10px; cursor: pointer; display: inline-flex;
    align-items: center; justify-content: center; gap: 6px; }
  button:hover { background: rgba(0,0,0,.06); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary { background: var(--accent); color: #1e1e1e; font-weight: 600; }
  button.primary:hover { filter: brightness(1.06); background: var(--accent); }
  button svg { width: 20px; height: 20px; }
  .sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
  #zoom { min-width: 54px; text-align: center; font-variant-numeric: tabular-nums; color: var(--soft); }
  #count { min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; color: var(--soft); }
  .pres-only { display: none; }
  body.presenting .pres-only { display: inline-flex; }
  body.presenting .free-only { display: none; }
  #caption { position: fixed; z-index: 2; top: 14px; left: 50%; transform: translateX(-50%);
    max-width: calc(100% - 32px); padding: 8px 16px; border-radius: 12px; background: var(--bar);
    border: 1.5px solid var(--line); font-weight: 600; text-align: center; opacity: 0;
    transition: opacity .3s; pointer-events: none; }
  body.presenting #caption { opacity: 1; }
  body.presenting #top { display: none; }
  #help { position: fixed; z-index: 2; right: 12px; top: 12px; color: var(--soft); font-size: 13px;
    padding: 8px 12px; }
  body.presenting #help { display: none; }
  @media (max-width: 640px) {
    #help, .wide { display: none !important; }
    button { min-width: 36px; padding: 0 8px; }
  }
  @media (prefers-reduced-motion: reduce) { #caption { transition: none; } }
</style>

<script>
(() => {
  const svg = document.querySelector("#stage svg");
  const stage = document.getElementById("stage");
  const W = 2266.134876, H = 1231.035508;
  // Partes do quadro (coordenadas do desenho) para o modo apresentação.
  const slides = [
    { title: "Figma Interprise — visão geral", r: [0, 0, W, H] },
    { title: "1 · Por que o Figma abriu escritório no Brasil?", r: [24, 50, 760, 470] },
    { title: "Modelo apresentado", r: [900, 20, 1190, 565] },
    { title: "2 · Qual o objetivo da Jessica?", r: [20, 640, 970, 410] },
    { title: "3 · Essas novas ferramentas irão atender nosso time?", r: [1085, 650, 1160, 560] },
    { title: "Figma Interprise — visão geral", r: [0, 0, W, H] },
  ];
  svg.removeAttribute("width");
  svg.removeAttribute("height");
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

  // Câmera: centro (cx, cy) e escala (px de tela por unidade do desenho).
  let cam = { cx: W / 2, cy: H / 2, s: 1 };
  let anim = null, presenting = false, slide = 0;
  const vw = () => stage.clientWidth, vh = () => stage.clientHeight;
  const fitScale = (r, pad) => Math.min((vw() - pad * 2) / r[2], (vh() - pad * 2) / r[3]);
  const minS = () => fitScale([0, 0, W, H], 0) * 0.5, maxS = 12;

  // Papel isométrico do projeto (mesmas regras do libreNotes): pontos numa
  // grade triangular de 24 px, alinhada à origem da nota, com 1,5 px na tela
  // e espaçamento ×4 quando o zoom fica pequeno demais.
  const paper = document.getElementById("paper"), pctx = paper.getContext("2d");
  const OX = 276.766, OY = 232.234, STEP = 24, DOT = "rgb(151, 173, 209)";
  function drawPaper(left, top) {
    const dpr = devicePixelRatio || 1, w = vw(), h = vh();
    if (paper.width !== Math.round(w * dpr) || paper.height !== Math.round(h * dpr)) {
      paper.width = Math.round(w * dpr); paper.height = Math.round(h * dpr);
    }
    pctx.clearRect(0, 0, paper.width, paper.height);
    pctx.fillStyle = DOT;
    let step = STEP;
    while (step * cam.s < 7) step *= 4;
    const row = step * Math.sqrt(3) / 2, r = 1.5 * dpr;
    const x0 = left + OX, y0 = top + OY, x1 = x0 + w / cam.s, y1 = y0 + h / cam.s;
    for (let j = Math.floor(y0 / row); j * row <= y1; j++) {
      const y = j * row, shift = (j & 1) ? step / 2 : 0;
      const sy = (y - y0) * cam.s * dpr;
      for (let x = Math.ceil((x0 - shift) / step) * step + shift; x <= x1; x += step) {
        pctx.fillRect((x - x0) * cam.s * dpr - r / 2, sy - r / 2, r, r);
      }
    }
  }

  function apply() {
    const w = vw() / cam.s, h = vh() / cam.s;
    svg.setAttribute("viewBox", `${cam.cx - w / 2} ${cam.cy - h / 2} ${w} ${h}`);
    drawPaper(cam.cx - w / 2, cam.cy - h / 2);
    document.getElementById("zoom").textContent = Math.round(cam.s * 100) + "%";
  }
  function stop() { if (anim) cancelAnimationFrame(anim); anim = null; }
  function flyTo(target, ms = 650) {
    stop();
    const from = { ...cam };
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) ms = 0;
    if (!ms) { cam = { ...target }; apply(); return; }
    const t0 = performance.now();
    const step = now => {
      const t = ms ? Math.min(1, (now - t0) / ms) : 1;
      const e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      // Zoom interpolado em escala logarítmica: a viagem parece natural.
      cam.s = Math.exp(Math.log(from.s) + (Math.log(target.s) - Math.log(from.s)) * e);
      cam.cx = from.cx + (target.cx - from.cx) * e;
      cam.cy = from.cy + (target.cy - from.cy) * e;
      apply();
      anim = t < 1 ? requestAnimationFrame(step) : null;
    };
    anim = requestAnimationFrame(step);
  }
  const rectCam = (r, pad) => ({ cx: r[0] + r[2] / 2, cy: r[1] + r[3] / 2, s: fitScale(r, pad) });
  const pad = () => Math.max(24, Math.min(vw(), vh()) * 0.06);
  function fit(ms) { flyTo(rectCam([0, 0, W, H], pad()), ms); }
  function zoomAt(px, py, factor) {
    stop();
    const s = Math.min(maxS, Math.max(minS(), cam.s * factor));
    const r = stage.getBoundingClientRect();
    const dx = px - r.left - vw() / 2, dy = py - r.top - vh() / 2;
    // Mantém o ponto sob o cursor parado.
    cam.cx += dx / cam.s - dx / s;
    cam.cy += dy / cam.s - dy / s;
    cam.s = s;
    apply();
  }

  // ---- apresentação
  function show(i) {
    slide = Math.max(0, Math.min(slides.length - 1, i));
    const sl = slides[slide];
    document.getElementById("caption").textContent = sl.title;
    document.getElementById("count").textContent = `${slide + 1}/${slides.length}`;
    const top = 64, bottom = 76;
    const r = sl.r, s = Math.min((vw() - 48) / r[2], (vh() - top - bottom) / r[3]);
    // Centraliza no espaço entre a legenda e a barra.
    flyTo({ cx: r[0] + r[2] / 2, cy: r[1] + r[3] / 2 - (top - bottom) / 2 / s, s });
    history.replaceState(null, "", "#slide=" + (slide + 1));
  }
  function setPresenting(on) {
    presenting = on;
    document.body.classList.toggle("presenting", on);
    const b = document.getElementById("present");
    b.querySelector("span").textContent = on ? "Sair" : "Apresentar";
    b.title = on ? "Sair da apresentação (Esc)" : "Apresentar (P)";
    if (on) show(slide); else { history.replaceState(null, "", location.pathname); fit(); }
  }
  const next = () => presenting ? show(slide + 1) : setPresenting(true);
  const prev = () => presenting && show(slide - 1);

  // ---- mouse, toque e teclado
  stage.addEventListener("wheel", e => {
    e.preventDefault();
    if (e.ctrlKey || !e.deltaMode && Math.abs(e.deltaY) > 0 && !e.deltaX) {
      zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)));
    } else {
      stop(); cam.cx += e.deltaX / cam.s; cam.cy += e.deltaY / cam.s; apply();
    }
  }, { passive: false });
  const pts = new Map();
  let last = null;
  stage.addEventListener("pointerdown", e => {
    stage.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    stage.classList.add("dragging");
    stop(); last = null;
  });
  stage.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    const prevPt = pts.get(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) {
      cam.cx -= (e.clientX - prevPt.x) / cam.s; cam.cy -= (e.clientY - prevPt.y) / cam.s; apply();
    } else if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      if (last) {
        cam.cx -= (mx - last.mx) / cam.s; cam.cy -= (my - last.my) / cam.s;
        zoomAt(mx, my, d / last.d);
      }
      last = { d, mx, my };
    }
  });
  const up = e => { pts.delete(e.pointerId); last = null; if (!pts.size) stage.classList.remove("dragging"); };
  stage.addEventListener("pointerup", up);
  stage.addEventListener("pointercancel", up);
  stage.addEventListener("dblclick", e => zoomAt(e.clientX, e.clientY, 2));

  addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (["ArrowRight", "PageDown", " ", "Enter"].includes(k)) { e.preventDefault(); next(); }
    else if (["ArrowLeft", "PageUp", "Backspace"].includes(k)) { e.preventDefault(); prev(); }
    else if (k === "Escape" && presenting) setPresenting(false);
    else if (k === "Home" && presenting) show(0);
    else if (k === "End" && presenting) show(slides.length - 1);
    else if (k === "p" || k === "P") setPresenting(!presenting);
    else if (k === "f" || k === "F") toggleFull();
    else if (!presenting && (k === "+" || k === "=")) zoomAt(innerWidth / 2, innerHeight / 2, 1.25);
    else if (!presenting && k === "-") zoomAt(innerWidth / 2, innerHeight / 2, 0.8);
    else if (!presenting && k === "0") fit();
  });
  function toggleFull() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.().catch(() => {});
  }
  document.getElementById("in").onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 1.25);
  document.getElementById("out").onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 0.8);
  document.getElementById("fit").onclick = () => fit();
  document.getElementById("present").onclick = () => setPresenting(!presenting);
  document.getElementById("next").onclick = next;
  document.getElementById("prev").onclick = prev;
  document.getElementById("full").onclick = toggleFull;
  addEventListener("resize", () => presenting ? show(slide) : apply());

  // Link direto para um tema: ...#slide=3
  const m = location.hash.match(/slide=(\d+)/);
  cam = rectCam([0, 0, W, H], pad()); apply();
  if (m) { slide = +m[1] - 1; setPresenting(true); }
})();
</script>
</body>
</html>
